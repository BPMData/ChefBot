name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only what the offline tests import (not Flet, which the UI needs but the tests don't).
      - name: Install
        run: python -m pip install "httpx>=0.28" "markdown>=3.7" "fpdf2>=2.8.4" "pillow==12.3.0" "pytest>=8" "pypdf>=5"
      - name: Test
        run: python -m pytest -q
