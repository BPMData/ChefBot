group = "io.github.bpmdata.keepalive"
version = "0.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")   // the version Flet 1.0.5's app template uses
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "io.github.bpmdata.keepalive"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 23
        // Python finds KeepAlive by name through pyjnius, so R8 must not rename or drop it.
        consumerProguardFiles("consumer-rules.pro")
    }
}
