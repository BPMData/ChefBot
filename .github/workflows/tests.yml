name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # Actions > Tests > Run workflow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            server/requirements.txt
      # Only what the offline tests import (Flet for main.py: tests/test_keepalive.py drives reply()).
      - name: Install
        run: python -m pip install -r server/requirements.txt "flet==1.0.5" "httpx>=0.28" "markdown>=3.7" "fpdf2>=2.8.4" "pillow==12.3.0" "pytest>=8" "pypdf>=5"
      - name: Test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r server/requirements.txt
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - run: npm test
        working-directory: web
        env:
          CHEFBOT_TEST_PYTHON: python
      # The browser tests save screenshots (phone and desktop layouts) here; download them from the run's page.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web/test-results/
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CHEFBOT_AUTO_DEPLOY == 'true'
    needs: [test, web]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
