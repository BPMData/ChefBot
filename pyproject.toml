[project]
name = "chefbot"
version = "0.1.0"
description = "Tell it what's in your fridge; it writes you a recipe, then helps you perfect it."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bryan Murphy" }]
dependencies = [
    "flet==1.0.5",
    "httpx>=0.28",
    "markdown>=3.7",
    "fpdf2>=2.8.4",
    "pillow==12.3.0",
    "flet-camera==1.0.5",      # in-app camera for ingredient photos (phones)
]

[dependency-groups]
dev = [
    "flet[all]==1.0.5",
    "pytest>=8",
    "pypdf>=5",
]

[tool.flet]
org = "io.github.bpmdata"
product = "ChefBot"
company = "Bryan Murphy"
copyright = "Copyright (C) 2026 Bryan Murphy"

# Phone builds: camera for ingredient photos. `flet build apk` reads all of this, so no flags are needed.
permissions = ["camera"]

[tool.flet.app]
path = "src"

[tool.flet.splash]
color = "#110E0C"
dark_color = "#110E0C"

[tool.flet.android]
split_per_abi = true
# Android-only: pyjnius (Gallery saves, and how Python talks to flet-keepalive); flet-keepalive keeps a reply
# streaming while you're in another app (packages/flet-keepalive, a foreground service with a notification).
dependencies = ["pyjnius", "flet-keepalive"]
adaptive_icon_background = "#E8452C"

[tool.flet.android.dev_packages]
flet-keepalive = "packages/flet-keepalive"     # not on PyPI: built from this repo (path from the project root)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
